{% extends "base.html" %}
{% block title %}404 — Not Found{% endblock %}
{% block body %}
<div class="cn-error-page">
  <div>
    <div class="cn-error-page__code">404</div>
    <h1 class="cn-error-page__title">Page not found</h1>
    <p class="cn-error-page__desc">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{% if current_user.is_teacher %}{{ url_for('teacher.dashboard') }}{% else %}{{ url_for('student.dashboard') }}{% endif %}" class="cn-btn cn-btn--primary">
      <i class="bi bi-house"></i> Go to dashboard
    </a>
  </div>
</div>
{% endblock %}
