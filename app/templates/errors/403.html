{% extends "base.html" %}
{% block title %}403 — Access Denied{% endblock %}
{% block body %}
<div class="cn-error-page">
  <div>
    <div class="cn-error-page__code">403</div>
    <h1 class="cn-error-page__title">Access denied</h1>
    <p class="cn-error-page__desc">You don't have permission to access this resource.</p>
    <a href="{% if current_user.is_teacher %}{{ url_for('teacher.dashboard') }}{% else %}{{ url_for('student.dashboard') }}{% endif %}" class="cn-btn cn-btn--primary">
      <i class="bi bi-house"></i> Go to dashboard
    </a>
  </div>
</div>
{% endblock %}
