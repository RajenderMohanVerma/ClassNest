{% extends "base.html" %}
{% block title %}500 — Server Error{% endblock %}
{% block body %}
<div class="cn-error-page">
  <div>
    <div class="cn-error-page__code">500</div>
    <h1 class="cn-error-page__title">Server error</h1>
    <p class="cn-error-page__desc">Something went wrong. Please try again later.</p>
    <a href="{% if current_user.is_teacher %}{{ url_for('teacher.dashboard') }}{% else %}{{ url_for('student.dashboard') }}{% endif %}" class="cn-btn cn-btn--primary">
      <i class="bi bi-house"></i> Go to dashboard
    </a>
  </div>
</div>
{% endblock %}
