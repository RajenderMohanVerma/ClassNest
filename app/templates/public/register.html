{% extends "base.html" %}
{% block title %}Sign Up — {{ app_name }}{% endblock %}
{% block body %}
<div class="cn-auth">
  <div class="cn-auth__card">
    <div class="cn-auth__logo">
      <div class="cn-auth__logo-icon">
        <i class="bi bi-mortarboard-fill"></i>
      </div>
      <h1 class="cn-auth__title">Create Account</h1>
      <p class="cn-auth__subtitle">Join {{ app_name }} as a student</p>
    </div>

    {% include 'partials/alerts.html' %}

    <form method="POST" class="cn-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="cn-form-group">
        <label class="cn-label">Full Name</label>
        <input type="text" class="cn-input" name="name" value="{{ name or '' }}" required autofocus>
      </div>

      <div class="cn-form-group">
        <label class="cn-label">Email</label>
        <input type="email" class="cn-input" name="email" value="{{ email or '' }}" required>
      </div>

      <div class="cn-form-group">
        <label class="cn-label">Password</label>
        <div class="cn-password-wrap">
          <input type="password" class="cn-input" name="password" required id="password">
          <button type="button" class="cn-password-toggle" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="cn-form-group">
        <label class="cn-label">Confirm Password</label>
        <div class="cn-password-wrap">
          <input type="password" class="cn-input" name="confirm_password" required id="confirm">
          <button type="button" class="cn-password-toggle" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="cn-btn cn-btn--primary" style="width:100%;justify-content:center;">
        <i class="bi bi-person-plus"></i> Create Account
      </button>
    </form>

    <hr style="margin: var(--cn-space-6) 0; border: none; border-top: 1px solid var(--cn-border);">

    <div style="text-align: center; font-size: var(--cn-font-size-sm); color: var(--cn-text-secondary);">
      <p>Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--cn-indigo); font-weight: 500;">Sign in</a></p>
    </div>
  </div>
</div>
{% endblock %}
