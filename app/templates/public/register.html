{% extends "base.html" %}
{% block title %}Sign Up — {{ app_name }}{% endblock %}
{% block body %}
<div class="cn-auth">
  <div class="cn-auth__card">
    <div class="cn-auth__logo">
      <div class="cn-auth__logo-icon">
        <i class="bi bi-mortarboard-fill"></i>
      </div>
      <h1 class="cn-auth__title">Create Account</h1>
      <p class="cn-auth__subtitle">Join {{ app_name }} as a student</p>
    </div>

    {% include 'partials/alerts.html' %}

    <form method="POST" class="cn-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="cn-form-group">
        <label class="cn-label" for="name">Full Name</label>
        <input type="text" class="cn-input" id="name" name="name" value="{{ name or '' }}"
               required autofocus autocomplete="name" minlength="2">
      </div>

      <div class="cn-form-group">
        <label class="cn-label" for="reg-email">Email</label>
        <input type="email" class="cn-input" id="reg-email" name="email" value="{{ email or '' }}"
               required autocomplete="email" inputmode="email">
      </div>

      <div class="cn-form-group">
        <label class="cn-label" for="reg-password">Password</label>
        <div class="cn-password-wrap">
          <input type="password" class="cn-input" name="password" id="reg-password" required
                 autocomplete="new-password" minlength="6">
          <button type="button" class="cn-password-toggle" aria-label="Show password" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <small class="cn-hint">At least 6 characters.</small>
      </div>

      <div class="cn-form-group">
        <label class="cn-label" for="confirm">Confirm Password</label>
        <div class="cn-password-wrap">
          <input type="password" class="cn-input" name="confirm_password" id="confirm" required
                 autocomplete="new-password">
          <button type="button" class="cn-password-toggle" aria-label="Show password" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="cn-btn cn-btn--primary cn-btn--block">
        <i class="bi bi-person-plus"></i> Create Account
      </button>
    </form>

    <div class="cn-auth__footer">
      <p>Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
    </div>
  </div>
</div>
{% endblock %}
