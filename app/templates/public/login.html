{% extends "base.html" %}
{% block title %}Login — {{ app_name }}{% endblock %}
{% block body %}
<div class="cn-auth">
  <div class="cn-auth__card">
    <div class="cn-auth__logo">
      <div class="cn-auth__logo-icon">
        <img src="{{ url_for('static', filename='icons/icon-192.png') }}"
             alt="" width="56" height="56" decoding="async">
      </div>
      <h1 class="cn-auth__title">{{ app_name }}</h1>
      <p class="cn-auth__subtitle">{{ app_tagline }}</p>
    </div>

    {% include 'partials/alerts.html' %}

    <form method="POST" class="cn-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="cn-form-group">
        <label class="cn-label" for="email">Email</label>
        <input type="email" class="cn-input" id="email" name="email" value="{{ email or '' }}"
               required autofocus autocomplete="email" inputmode="email">
      </div>

      <div class="cn-form-group">
        <label class="cn-label" for="password">Password</label>
        <div class="cn-password-wrap">
          <input type="password" class="cn-input" name="password" id="password" required
                 autocomplete="current-password">
          <button type="button" class="cn-password-toggle" aria-label="Show password" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="cn-form-group cn-form-inline">
        <label class="cn-checkbox" for="remember">
          <input type="checkbox" id="remember" name="remember" value="on">
          <span>Keep me signed in</span>
        </label>
      </div>

      <button type="submit" class="cn-btn cn-btn--primary cn-btn--block">
        <i class="bi bi-box-arrow-in-right"></i> Sign in
      </button>
    </form>

    <div class="cn-auth__footer">
      <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
    </div>
  </div>
</div>
{% endblock %}
