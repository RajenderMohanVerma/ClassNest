{% extends "base.html" %}
{% block title %}Choose a new password — {{ app_name }}{% endblock %}
{% block body %}
<div class="cn-auth cn-auth--simple">
  <div class="cn-auth__card">
    <div class="cn-auth__logo">
      <div class="cn-auth__logo-icon">
        <img src="{{ url_for('static', filename='icons/logo.svg') }}"
             alt="" width="56" height="56" decoding="async">
      </div>
      <h1 class="cn-auth__title">Choose a new password</h1>
      <p class="cn-auth__subtitle">This link works once. Pick a password you have not used before.</p>
    </div>

    {% include 'partials/alerts.html' %}

    <form method="POST" class="cn-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="cn-form-group">
        <label class="cn-label" for="password">New password</label>
        <div class="cn-password-wrap">
          <input type="password" class="cn-input" name="password" id="password" required
                 autofocus autocomplete="new-password" minlength="6">
          <button type="button" class="cn-password-toggle" aria-label="Show password" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="cn-form-group">
        <label class="cn-label" for="confirm_password">Confirm new password</label>
        <input type="password" class="cn-input" name="confirm_password" id="confirm_password"
               required autocomplete="new-password" minlength="6">
      </div>

      <button type="submit" class="cn-btn cn-btn--primary cn-btn--block">
        <i class="bi bi-shield-check"></i> Save new password
      </button>
    </form>

    <div class="cn-auth__footer">
      <p><a href="{{ url_for('auth.login') }}"><i class="bi bi-arrow-left"></i> Back to sign in</a></p>
    </div>
  </div>
</div>
{% endblock %}
