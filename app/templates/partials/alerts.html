{% for category, message in get_flashed_messages(with_categories=true) %}
<div class="cn-alert cn-alert--{{ category }}" role="status">
  <i class="bi {% if category == 'success' %}bi-check-circle-fill{% elif category == 'error' %}bi-exclamation-circle-fill{% elif category == 'warning' %}bi-exclamation-triangle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
  <span>{{ message }}</span>
  <button type="button" class="cn-alert__close" aria-label="Dismiss message">&times;</button>
</div>
{% endfor %}
