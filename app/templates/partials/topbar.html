<header class="cn-topbar">
  <div class="cn-topbar__left">
    <button class="cn-topbar__toggle" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
      <i class="bi bi-list"></i>
    </button>
    <div class="cn-topbar__title" aria-live="polite">{{ page_title|default('Workspace') }}</div>
  </div>
  <div class="cn-topbar__right">
    <a class="cn-topbar__public-link" href="{{ url_for('public.classes') }}"><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i><span>View public site</span></a>
    <button class="cn-icon-btn" type="button" id="themeToggle" aria-label="Switch colour theme" title="Switch theme">
      <i class="bi bi-moon-stars" data-theme-icon></i>
    </button>
    {% if current_user %}
    <a class="cn-topbar__user"
       href="{{ url_for('teacher.profile') if current_user.is_teacher else url_for('student.profile') }}">
      <span class="cn-topbar__avatar" aria-hidden="true">{{ current_user.initials }}</span>
      <span class="cn-topbar__user-name">{{ current_user.name }}</span>
      <span class="cn-badge cn-badge--primary">{{ current_user.role_label }}</span>
    </a>
    {% endif %}
  </div>
</header>
